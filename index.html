<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halal Feasto — Contact Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:        #C81E1E;
    --red-deep:   #8F1116;
    --red-soft:   #F6D9D6;
    --cream:      #FFFBF5;
    --cream-dim:  #F3EBE0;
    --ink:        #2A1E18;
    --slate:      #7A6E66;
    --gold:       #F0A93B;
    --line:       rgba(42,30,24,0.12);
    --display: "Bebas Neue", "Arial Narrow", sans-serif;
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
    --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
 
  *{ box-sizing: border-box; }
 
  html, body{ margin:0; padding:0; min-height:100%; font-family: var(--sans); color: var(--ink); }
 
  body{
    display:flex; align-items:center; justify-content:center; padding: 32px 18px;
    background:
      radial-gradient(circle at 50% -10%, rgba(200,30,30,0.25), transparent 55%),
      var(--red-deep);
  }
 
  .stage{ width: 100%; max-width: 400px; }
 
  .card{
    background: var(--cream);
    border-radius: 22px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 60px -18px rgba(0,0,0,0.55);
    opacity: 0;
    transform: translateY(16px);
    animation: card-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
  }
 
  .card-inner{ padding: 40px 32px 30px; text-align:center; }
 
  .logo-wrap{
    width: 118px;
    height: 118px;
    margin: 0 auto 22px;
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 14px 28px -10px rgba(143,17,22,0.55);
    position: relative;
    opacity: 0;
    transform: scale(0.7);
    animation: logo-in 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.25s forwards;
  }
  .logo-wrap img{
    width: 100%; height: 100%; object-fit: cover; display:block;
  }
  .logo-glow{
    position:absolute; inset:-40%;
    background: radial-gradient(circle, rgba(240,169,59,0.35), transparent 60%);
    animation: glow-pulse 4.5s ease-in-out infinite;
  }
 
  .name{
    font-family: var(--serif);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 29px;
    line-height: 1.15;
    color: var(--ink);
    margin: 0 0 12px;
  }
 
  .title-badge{
    display: inline-block;
    background: var(--red-soft);
    color: var(--red-deep);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 6px 16px;
    border-radius: 999px;
    margin: 0 0 20px;
  }
 
  .company-row{
    font-family: var(--display);
    color: var(--red);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 3.5px;
    margin: 0 0 22px;
    -webkit-text-stroke: 0.6px var(--red);
  }
 
  .divider{
    width: 44px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, var(--red), var(--gold));
    margin: 0 auto 24px;
  }
 
  .field{
    display:flex; gap: 14px; padding: 12px 2px; border-bottom: 1px solid var(--line);
    text-align:left;
  }
  .field:last-of-type{ border-bottom: none; }
  .field .label{ width: 62px; flex-shrink:0; font-size: 11px; color: var(--red); font-weight:600; letter-spacing: 0.4px; padding-top: 2px; }
  .field .value{ font-size: 15px; color: var(--ink); word-break: break-word; }
  .field .value a{ color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
 
  .actions{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap: 8px; height: 46px; border-radius: 12px;
    font-size: 13.5px; font-weight: 600; text-decoration:none; border: 1px solid var(--line); color: var(--ink);
    background: var(--cream-dim); cursor:pointer; transition: transform 0.15s ease;
  }
  .btn:active{ transform: scale(0.97); }
 
  .btn-primary{
    grid-column: 1 / -1;
    background: linear-gradient(135deg, var(--red), var(--red-deep));
    color: #fff; border: none; height: 50px; font-size: 14px; letter-spacing: 0.2px;
    box-shadow: 0 10px 22px -8px rgba(200,30,30,0.6);
  }
 
  .status{ text-align:center; font-size: 12.5px; color: var(--slate); margin-top: 12px; min-height: 16px; }
 
  .footer-note{ text-align:center; font-size: 11px; color: rgba(255,251,245,0.55); margin-top: 22px; letter-spacing: 0.3px; }
 
  @keyframes card-in{ to{ opacity:1; transform: translateY(0); } }
  @keyframes logo-in{ to{ opacity:1; transform: scale(1); } }
  @keyframes glow-pulse{
    0%, 100%{ opacity: 0.35; }
    50%{ opacity: 0.75; }
  }
 
  @media (prefers-reduced-motion: reduce){
    .card, .logo-wrap{ animation: none; opacity:1; transform:none; }
    .logo-glow{ animation: none; opacity: 0.4; }
  }
</style>
</head>

      <h1 class="name" id="c-name">Sam</h1>
      <p class="title-badge" id="c-title">Chief Executive Officer</p>
      <p class="company-row">HALAL FEAST Ó</p>
 
      <div class="divider"></div>
 
      <div id="fields"></div>
 
      <div class="actions">
        <button class="btn btn-primary" id="save-btn" type="button">Save to Contacts</button>
        <a class="btn" id="call-btn" href="#">Call</a>
        <a class="btn" id="email-btn" href="#">Email</a>
      </div>
      <p class="status" id="status"></p>
    </div>
  </div>
  <p class="footer-note">Tap "Save to Contacts" to add this card to your phone</p>
</div>
 
<script>
  // Read a permanent ID from the URL, e.g. index.html?id=store-buffalo
  // The actual name/title/phone/email live in contacts.json, NOT in this URL.
  // This means the printed QR code never has to change --
  // only contacts.json needs editing when someone's role changes.
 
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
 
  const fallback = {
    name: 'Sam',
    title: 'Chief Executive Officer',
    company: 'Halal Feasto',
    phone: '646-577-2804',
    email: 'halalfeasto@gmail.com',
    website: 'halalfeasto.com',
    address: ''
  };
 
  function renderCard(data){
    document.title = data.name + ' — Halal Feasto';
    document.getElementById('c-name').textContent = data.name;
    document.getElementById('c-title').textContent = data.title;
 
    const fieldsEl = document.getElementById('fields');
    fieldsEl.innerHTML = '';
 
    function addField(label, valueHTML){
      const row = document.createElement('div');
      row.className = 'field';
      row.innerHTML = '<div class="label">' + label + '</div><div class="value">' + valueHTML + '</div>';
      fieldsEl.appendChild(row);
    }
 
    const telDigits = data.phone.replace(/[^+\d]/g, '');
    const telHref = telDigits.startsWith('+') ? telDigits : '+1' + telDigits;
    const mailHref = 'mailto:' + data.email;
 
    addField('Phone', '<a href="tel:' + telHref + '">' + data.phone + '</a>');
    addField('Email', '<a href="' + mailHref + '">' + data.email + '</a>');
    if (data.website){
      const url = data.website.startsWith('http') ? data.website : 'https://' + data.website;
      addField('Web', '<a href="' + url + '" target="_blank" rel="noopener">' + data.website + '</a>');
    }
    if (data.address){
      addField('Office', data.address);
    }
 
    document.getElementById('call-btn').href = 'tel:' + telHref;
    document.getElementById('email-btn').href = mailHref;
 
    function buildVCard(d){
      const nameParts = d.name.trim().split(/\s+/);
      const last = nameParts.length > 1 ? nameParts.pop() : '';
      const first = nameParts.join(' ');
      const lines = [
        'BEGIN:VCARD', 'VERSION:3.0',
        'N:' + last + ';' + first + ';;;',
        'FN:' + d.name,
        'ORG:' + (d.company || 'Halal Feasto'),
        'TITLE:' + d.title,
        'TEL;TYPE=CELL:' + telHref,
        'EMAIL:' + d.email
      ];
      if (d.website){
        lines.push('URL:' + (d.website.startsWith('http') ? d.website : 'https://' + d.website));
      }
      lines.push('END:VCARD');
      return lines.join('\r\n');
    }
 
    document.getElementById('save-btn').onclick = function(){
      const vcard = buildVCard(data);
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = data.name.replace(/\s+/g, '_') + '.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      document.getElementById('status').textContent =
        'If your phone didn\'t prompt automatically, open the downloaded file to finish saving.';
    };
  }
 
  if (id){
    fetch('contacts.json')
      .then(res => res.json())
      .then(contacts => {
        const data = contacts[id];
        if (data){
          renderCard(Object.assign({}, data, { company: 'Halal Feasto', website: 'halalfeasto.com' }));
        } else {
          document.getElementById('status').textContent = 'No contact found for "' + id + '". Check contacts.json.';
          renderCard(fallback);
        }
      })
      .catch(() => {
        document.getElementById('status').textContent = 'Could not load contacts.json.';
        renderCard(fallback);
      });
  } else {
    const data = {
      name:    params.get('name')    || fallback.name,
      title:   params.get('title')   || fallback.title,
      company: params.get('company') || fallback.company,
      phone:   params.get('phone')   || fallback.phone,
      email:   params.get('email')   || fallback.email,
      website: params.get('website') || fallback.website,
      address: params.get('address') || ''
    };
    renderCard(data);
  }
</script>
</script>
